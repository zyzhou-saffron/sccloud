# scCloud v2 — GPU 服务器完整部署 (host 网络模式)
# 端口规划: Nginx 9000 / Frontend 3000 / Backend 8000 / R 8787 / DB 3307 / Redis 6380
#
# 部署: docker compose -f docker-compose.server.yml --env-file .env.server up -d
# 查看: docker compose -f docker-compose.server.yml logs -f
# 停止: docker compose -f docker-compose.server.yml --env-file .env.server down
# 访问: http://<server-ip>:9000

services:
  # ---- Nginx 反向代理 (统一入口 :9000) ----
  nginx:
    image: nginx:alpine
    network_mode: host
    restart: unless-stopped
    depends_on: [frontend, backend]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # ---- 前端 (Next.js :3000) ----
  frontend:
    build:
      context: ./frontend
      args:
        # 构建时注入 — host 网络模式下后端在 localhost:8000
        BACKEND_URL: http://localhost:8000
    network_mode: host
    restart: unless-stopped
    depends_on: [backend]
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3001"

  # ---- API 网关 (FastAPI :8000) ----
  backend:
    build: ./backend
    network_mode: host
    env_file: .env.server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql+pymysql://${DB_USER}:${DB_PASS}@127.0.0.1:3307/${DB_NAME}"
      REDIS_URL: "redis://127.0.0.1:6380/0"
      R_ENGINE_URL: "http://127.0.0.1:8787"
      R_ENGINE_TIMEOUT: "3600"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_ALGORITHM: "HS256"
      PROJECTS_ROOT: "${PROJECTS_ROOT:-/data/projects}"
      ENVIRONMENT: "production"
    volumes:
      - ./backend:/app
      - ${PROJECTS_ROOT:-/data/projects}:${PROJECTS_ROOT:-/data/projects}
      - ./r-engine/data:/app/r-engine-data

  # ---- R 计算引擎 (Plumber :8787) ----
  r-engine:
    image: sccloud-r-engine
    # 一键部署: 优先用上面的 image(可改成 ghcr.io/<owner>/sccloud-r-engine:<tag> 直接拉);
    # build 作兜底, 供维护者本地重建(需先备好 r-engine/r-library, 见 README/issue)
    build:
      context: ./r-engine
      dockerfile: Dockerfile
    network_mode: host
    restart: unless-stopped
    environment:
      REDIS_URL: "redis://127.0.0.1:6380/0"
    volumes:
      - ./backend:/app
      - ${PROJECTS_ROOT:-/data/projects}:${PROJECTS_ROOT:-/data/projects}
      - ./r-engine/data:/app/data
      - ./r-engine/plumber.R:/app/plumber.R:ro
      - ./r-engine/R:/app/R:ro
    # deploy:
      # resources:
        # limits:
    mem_limit: 128g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 60s
      retries: 3

  # ---- R 计算引擎 — 快请求专用实例 (Plumber :8788, #42 重任务/快请求分流) ----
  # 同镜像/同挂载；plot_markers / cellchat_pathway 等只读重出图走这里，永不被 inferCNV 等重任务堵
  # command 覆盖端口为 8788（$$ 转义，避免 compose 把 $run 当变量插值）
  r-engine-quick:
    image: sccloud-r-engine
    command: ["R", "-e", "plumber::plumb('plumber.R')$$run(host='0.0.0.0', port=8788)"]
    network_mode: host
    restart: unless-stopped
    environment:
      REDIS_URL: "redis://127.0.0.1:6380/0"
    volumes:
      - ./backend:/app
      - ${PROJECTS_ROOT:-/data/projects}:${PROJECTS_ROOT:-/data/projects}
      - ./r-engine/data:/app/data
      - ./r-engine/plumber.R:/app/plumber.R:ro
      - ./r-engine/R:/app/R:ro
    mem_limit: 32g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8788/health"]
      interval: 30s
      timeout: 60s
      retries: 3

  # ---- 重任务 worker (#42 Phase2: 队列 + 独立可 kill 子进程, 取代引擎池) ----
  # 跑 worker.R: BRPOP scc:heavyqueue → spawn run_job.R(独立 Rscript 进程, 用 pr$call 原地复用
  # 现有 plumber 端点) → 监督 + 收到取消即 kill -9。每个重任务一个独立进程 → 干净可 kill + 内存全回收。
  # 起 N 路并发: 部署时 docker compose up --scale r-engine-worker=N。非 HTTP 服务, 禁 healthcheck。
  r-engine-worker:
    image: sccloud-r-engine
    command: ["Rscript", "/app/worker.R"]
    network_mode: host
    restart: unless-stopped
    environment:
      REDIS_URL: "redis://127.0.0.1:6380/0"
    volumes:
      - ${PROJECTS_ROOT:-/data/projects}:${PROJECTS_ROOT:-/data/projects}
      - ./r-engine/data:/app/data
      - ./r-engine/run_job.R:/app/run_job.R:ro
      - ./r-engine/worker.R:/app/worker.R:ro
      - ./r-engine/plumber.R:/app/plumber.R:ro
      - ./r-engine/R:/app/R:ro
    mem_limit: 128g
    healthcheck:
      disable: true

  # ---- 数据库 (MariaDB :3307) ----
  db:
    image: mariadb:11
    network_mode: host
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASS}"
      MYSQL_DATABASE: "${DB_NAME}"
      MYSQL_USER: "${DB_USER}"
      MYSQL_PASSWORD: "${DB_PASS}"
      MYSQL_TCP_PORT: "3307"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb -h 127.0.0.1 -P 3307 -u root -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1'"]
      interval: 10s
      timeout: 60s
      retries: 10

  # ---- 消息队列 (Redis :6380) ----
  redis:
    image: redis:7-alpine
    network_mode: host
    restart: unless-stopped
    command: redis-server --port 6380
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db_data:
  projects_data:
    external: true
    name: sccloud-r-engine_projects_data
