name: Build and Publish Docker Images

# main 推送（仅相关 paths）/ 手动触发：构建 frontend + backend 并推 GHCR（linux/amd64 + linux/arm64）。
# r-engine 依赖 gitignore 的 r-library，本仓库 CI 不构建；在 GPU 本机构建后：
#   docker tag <local> ghcr.io/zyzhou-saffron/sccloud-r-engine:latest
#   docker push ghcr.io/zyzhou-saffron/sccloud-r-engine:latest
#
# 镜像标签：latest + git 短 SHA。
# 可选 ACR 同步：配置 Variables/Secrets 后自动 mirror。
#
# paths：改 README / compose / 文档等不触发；仅 frontend/**、backend/** 或本 workflow 变更才跑。
# 组件级：只改 frontend 时不重建 backend（反之亦然）；workflow_dispatch 或改本文件则两者都建。
#
# 阿里云 ACR（可选）：
#   Variables: ALIYUN_ACR_REGISTRY, ALIYUN_ACR_NAMESPACE
#   Secrets:   ALIYUN_ACR_USERNAME, ALIYUN_ACR_PASSWORD
# 注意：if 里不能直接写 secrets.*；密码经 job env 注入后再判断。

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # paths-filter 读 PR/commit 文件列表
  pull-requests: read

env:
  GHCR_OWNER: zyzhou-saffron

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.result.outputs.frontend }}
      backend: ${{ steps.result.outputs.backend }}
      workflow: ${{ steps.result.outputs.workflow }}
    steps:
      - name: Checkout
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            workflow:
              - '.github/workflows/docker-publish.yml'

      - name: Set change flags
        id: result
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "workflow=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=${{ steps.filter.outputs.frontend }}" >> "$GITHUB_OUTPUT"
            echo "backend=${{ steps.filter.outputs.backend }}" >> "$GITHUB_OUTPUT"
            echo "workflow=${{ steps.filter.outputs.workflow }}" >> "$GITHUB_OUTPUT"
          fi
          echo "event=${{ github.event_name }} fe=${{ steps.filter.outputs.frontend }} be=${{ steps.filter.outputs.backend }} wf=${{ steps.filter.outputs.workflow }}"

  build:
    needs: changes
    if: |
      always() && !cancelled() && (
        needs.changes.outputs.frontend == 'true' ||
        needs.changes.outputs.backend == 'true' ||
        needs.changes.outputs.workflow == 'true'
      )
    runs-on: ubuntu-latest
    env:
      ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
      ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            context: ./frontend
            image: sccloud-frontend
            platforms: linux/amd64,linux/arm64
            build-args: |
              BACKEND_URL=http://backend:8000
          - component: backend
            context: ./backend
            image: sccloud-backend
            platforms: linux/amd64,linux/arm64
            build-args: ""
    steps:
      - name: Decide whether to build
        id: skip
        run: |
          set -e
          comp="${{ matrix.component }}"
          # 改 workflow 或手动触发：两边都建
          if [ "${{ needs.changes.outputs.workflow }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Building $comp (workflow change or manual dispatch)"
            exit 0
          fi
          if [ "$comp" = "frontend" ] && [ "${{ needs.changes.outputs.frontend }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$comp" = "backend" ] && [ "${{ needs.changes.outputs.backend }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=false" >> "$GITHUB_OUTPUT"
          echo "Skip $comp (no relevant path changes)"

      - name: Checkout
        if: steps.skip.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: steps.skip.outputs.run == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.skip.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.skip.outputs.run == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        if: ${{ steps.skip.outputs.run == 'true' && vars.ALIYUN_ACR_REGISTRY != '' && env.ACR_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ALIYUN_ACR_REGISTRY }}
          username: ${{ env.ACR_USERNAME }}
          password: ${{ env.ACR_PASSWORD }}

      - name: Derive image tags
        if: steps.skip.outputs.run == 'true'
        id: tags
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.component }}
        if: steps.skip.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platforms }}
          push: true
          build-args: ${{ matrix.build-args }}
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/${{ matrix.image }}:latest
            ghcr.io/${{ env.GHCR_OWNER }}/${{ matrix.image }}:${{ steps.tags.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: false

      - name: Mirror to Aliyun ACR
        if: ${{ steps.skip.outputs.run == 'true' && vars.ALIYUN_ACR_REGISTRY != '' && env.ACR_PASSWORD != '' }}
        run: |
          set -e
          SRC="ghcr.io/${GHCR_OWNER}/${{ matrix.image }}:latest"
          ACR_BASE="${{ vars.ALIYUN_ACR_REGISTRY }}/${{ vars.ALIYUN_ACR_NAMESPACE }}/${{ matrix.image }}"
          echo "Mirroring multi-arch ${SRC} -> ${ACR_BASE}:{latest,${{ steps.tags.outputs.sha }}}"
          docker buildx imagetools create \
            -t "${ACR_BASE}:latest" \
            -t "${ACR_BASE}:${{ steps.tags.outputs.sha }}" \
            "${SRC}"
          echo "ACR sync completed."
