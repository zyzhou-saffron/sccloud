name: Build and Publish Docker Images

# main 推送（仅相关 paths）/ GitHub Release 发布 / 手动触发：
#   构建 frontend + backend 并推 GHCR。
# r-engine 依赖 gitignore 的 r-library，本仓库 CI 不构建；在 GPU 本机构建后：
#   docker tag <local> ghcr.io/zyzhou-saffron/sccloud-r-engine:latest
#   docker push ghcr.io/zyzhou-saffron/sccloud-r-engine:latest
#
# 平台：
#   - frontend: linux/amd64 only
#     Next.js `npm run build` under QEMU arm64 hits SIGILL during static generation
#     (qemu: Illegal instruction). GPU deploy targets are amd64; do not re-enable
#     arm64 for frontend until native ARM runners are used.
#   - backend: linux/amd64 + linux/arm64（纯 Python 镜像，QEMU 可过）
#
# 镜像标签：
#   - 日常 main：latest + git 短 SHA
#   - Release Please 发版（release published）：另加 vX.Y.Z 与 X.Y.Z
#
# paths：改 README / compose / 文档等不触发；仅 frontend/**、backend/** 或本 workflow 变更才跑。
# 组件级：只改 frontend 时不重建 backend（反之亦然）；
# workflow_dispatch / 改本文件 / release 事件则两者都建。
#
# 阿里云 ACR（可选）：
#   Variables: ALIYUN_ACR_REGISTRY, ALIYUN_ACR_NAMESPACE
#   Secrets:   ALIYUN_ACR_USERNAME, ALIYUN_ACR_PASSWORD
# 注意：if 里不能直接写 secrets.*；密码经 job env 注入后再判断。

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/docker-publish.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: read

env:
  GHCR_OWNER: zyzhou-saffron

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.result.outputs.frontend }}
      backend: ${{ steps.result.outputs.backend }}
      workflow: ${{ steps.result.outputs.workflow }}
      version: ${{ steps.result.outputs.version }}
    steps:
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            workflow:
              - '.github/workflows/docker-publish.yml'

      - name: Set change flags
        id: result
        run: |
          set -e
          # 发版 / 手动：两边都建
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "release" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "workflow=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=${{ steps.filter.outputs.frontend }}" >> "$GITHUB_OUTPUT"
            echo "backend=${{ steps.filter.outputs.backend }}" >> "$GITHUB_OUTPUT"
            echo "workflow=${{ steps.filter.outputs.workflow }}" >> "$GITHUB_OUTPUT"
          fi

          # 版本标签：仅 release 事件打 vX.Y.Z
          ver=""
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            ver="${tag#v}"
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "event=${{ github.event_name }} version=${ver:-none}"

  build:
    needs: changes
    if: |
      always() && !cancelled() && (
        needs.changes.outputs.frontend == 'true' ||
        needs.changes.outputs.backend == 'true' ||
        needs.changes.outputs.workflow == 'true'
      )
    runs-on: ubuntu-latest
    env:
      ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
      ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            context: ./frontend
            image: sccloud-frontend
            platforms: linux/amd64
            build-args: |
              BACKEND_URL=http://backend:8000
          - component: backend
            context: ./backend
            image: sccloud-backend
            platforms: linux/amd64,linux/arm64
            build-args: ""
    steps:
      - name: Decide whether to build
        id: skip
        run: |
          set -e
          comp="${{ matrix.component }}"
          if [ "${{ needs.changes.outputs.workflow }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Building $comp (workflow change, release, or manual dispatch)"
            exit 0
          fi
          if [ "$comp" = "frontend" ] && [ "${{ needs.changes.outputs.frontend }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$comp" = "backend" ] && [ "${{ needs.changes.outputs.backend }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=false" >> "$GITHUB_OUTPUT"
          echo "Skip $comp (no relevant path changes)"

      - name: Checkout
        if: steps.skip.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up QEMU
        # Only needed for multi-arch (backend). Frontend is amd64-native on ubuntu-latest.
        if: steps.skip.outputs.run == 'true' && contains(matrix.platforms, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.skip.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.skip.outputs.run == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        if: ${{ steps.skip.outputs.run == 'true' && vars.ALIYUN_ACR_REGISTRY != '' && env.ACR_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ALIYUN_ACR_REGISTRY }}
          username: ${{ env.ACR_USERNAME }}
          password: ${{ env.ACR_PASSWORD }}

      - name: Derive image tags
        if: steps.skip.outputs.run == 'true'
        id: tags
        run: |
          set -e
          SHA="${GITHUB_SHA::7}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

          OWNER="${{ env.GHCR_OWNER }}"
          IMG="${{ matrix.image }}"
          BASE="ghcr.io/${OWNER}/${IMG}"

          {
            echo "list<<EOF"
            echo "${BASE}:latest"
            echo "${BASE}:${SHA}"
            VER="${{ needs.changes.outputs.version }}"
            if [ -n "$VER" ]; then
              echo "${BASE}:v${VER}"
              echo "${BASE}:${VER}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Tags:"
          echo "${BASE}:latest"
          echo "${BASE}:${SHA}"
          if [ -n "${{ needs.changes.outputs.version }}" ]; then
            echo "${BASE}:v${{ needs.changes.outputs.version }}"
            echo "${BASE}:${{ needs.changes.outputs.version }}"
          fi

      - name: Build and push ${{ matrix.component }}
        if: steps.skip.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platforms }}
          push: true
          build-args: ${{ matrix.build-args }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: false

      - name: Mirror to Aliyun ACR
        if: ${{ steps.skip.outputs.run == 'true' && vars.ALIYUN_ACR_REGISTRY != '' && env.ACR_PASSWORD != '' }}
        run: |
          set -e
          SRC="ghcr.io/${GHCR_OWNER}/${{ matrix.image }}:latest"
          ACR_BASE="${{ vars.ALIYUN_ACR_REGISTRY }}/${{ vars.ALIYUN_ACR_NAMESPACE }}/${{ matrix.image }}"
          extra=(-t "${ACR_BASE}:latest" -t "${ACR_BASE}:${{ steps.tags.outputs.sha }}")
          VER="${{ needs.changes.outputs.version }}"
          if [ -n "$VER" ]; then
            extra+=(-t "${ACR_BASE}:v${VER}" -t "${ACR_BASE}:${VER}")
          fi
          echo "Mirroring multi-arch ${SRC} -> ${ACR_BASE} (${extra[*]})"
          docker buildx imagetools create "${extra[@]}" "${SRC}"
          echo "ACR sync completed."
