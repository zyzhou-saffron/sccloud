name: Build and Publish Docker Images

# main 推送 / 手动触发：构建 frontend + backend 并推 GHCR（linux/amd64 + linux/arm64）。
# r-engine 依赖 gitignore 的 r-library，本仓库 CI 不构建；在 GPU 本机构建后：
#   docker tag <local> ghcr.io/zyzhou-saffron/sccloud-r-engine:latest
#   docker push ghcr.io/zyzhou-saffron/sccloud-r-engine:latest
#
# 镜像标签：latest + git 短 SHA。
# 可选 ACR 同步：配置下方 Variables/Secrets 后自动 mirror（imagetools，多架构清单一并复制）。
#
# 阿里云 ACR（可选，与 .env.example 镜像前缀保持一致）：
#   Variables: ALIYUN_ACR_REGISTRY   例 registry.cn-hangzhou.aliyuncs.com
#              ALIYUN_ACR_NAMESPACE  例 your-namespace
#   Secrets:   ALIYUN_ACR_USERNAME, ALIYUN_ACR_PASSWORD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR_OWNER: zyzhou-saffron

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            context: ./frontend
            image: sccloud-frontend
            platforms: linux/amd64,linux/arm64
            build-args: |
              BACKEND_URL=http://backend:8000
          - component: backend
            context: ./backend
            image: sccloud-backend
            platforms: linux/amd64,linux/arm64
            build-args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        if: ${{ vars.ALIYUN_ACR_REGISTRY != '' && secrets.ALIYUN_ACR_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Derive image tags
        id: tags
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platforms }}
          push: true
          build-args: ${{ matrix.build-args }}
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/${{ matrix.image }}:latest
            ghcr.io/${{ env.GHCR_OWNER }}/${{ matrix.image }}:${{ steps.tags.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: false

      - name: Mirror to Aliyun ACR
        if: ${{ vars.ALIYUN_ACR_REGISTRY != '' && secrets.ALIYUN_ACR_PASSWORD != '' }}
        run: |
          set -e
          SRC="ghcr.io/${GHCR_OWNER}/${{ matrix.image }}:latest"
          ACR_BASE="${{ vars.ALIYUN_ACR_REGISTRY }}/${{ vars.ALIYUN_ACR_NAMESPACE }}/${{ matrix.image }}"
          echo "Mirroring multi-arch ${SRC} -> ${ACR_BASE}:{latest,${{ steps.tags.outputs.sha }}}"
          docker buildx imagetools create \
            -t "${ACR_BASE}:latest" \
            -t "${ACR_BASE}:${{ steps.tags.outputs.sha }}" \
            "${SRC}"
          echo "ACR sync completed."
          echo "本地 .env 可设："
          echo "  FRONTEND_IMAGE=${{ vars.ALIYUN_ACR_REGISTRY }}/${{ vars.ALIYUN_ACR_NAMESPACE }}/sccloud-frontend:latest"
          echo "  BACKEND_IMAGE=${{ vars.ALIYUN_ACR_REGISTRY }}/${{ vars.ALIYUN_ACR_NAMESPACE }}/sccloud-backend:latest"
